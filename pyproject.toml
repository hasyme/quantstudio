[build-system]
# setuptools 锁 <77：≥77 强制 PEP 639 SPDX（Proprietary 非合法 SPDX id，构建失败）；
# 68-76 接受 license table 格式，与本地 setuptools 65 语义一致（CI/本地构建行为统一）
requires = ["setuptools>=68,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstudio"
version = "0.3.2+mvp"
description = "标准化数据管道 + 通用量化回测系统（双层校验 + 双轨回测引擎）"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "QuantStudio"}]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "duckdb>=1.4.5,<1.6",  # 放开 1.5.x：1.5.6 修复 stock_daily 写停摆（H9 A/B 实证）；#23645 index-DELETE 风险已评估接受
    "filelock>=3.0",
    "fastjsonschema>=2.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "psutil>=5.9",  # 常驻采集进程身份校验（PID + create_time + exe + cmdline）
    # 客户反馈包 2026-09-23 问题4：MCP export 分片读写 Parquet 的引擎依赖
    # （pandas.read_parquet / pyarrow.parquet.read_schema）。此前未声明 ⇒ 全新克隆
    # 装完 ".[all]" 仍缺 pyarrow，表现为「注入 0 行」的误导性报错（见
    # mcp_adapter._parquet_has_column 的依赖缺失显式化）。
    "pyarrow>=14",
]

[project.optional-dependencies]
# 数据源（按需安装）
tushare = ["tushare>=1.2.89"]
baostock = ["baostock>=0.8.8"]
akshare = ["akshare>=1.10.0"]
# 数据库
questdb = ["questdb>=1.0.0"]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1.0"]
# GUI
gui = ["PyQt6>=6.5.0", "PyQt6-Fluent-Widgets>=1.11", "matplotlib>=3.5"]
qfluentwidgets = ["PyQt6-Fluent-Widgets>=1.11"]
# 全量
all = [
    "tushare>=1.2.89",
    "baostock>=0.8.8",
    "akshare>=1.10.0",
    "duckdb>=1.4.5,<1.6",  # 放开 1.5.x：1.5.6 修复 stock_daily 写停摆（H9 A/B 实证）；#23645 index-DELETE 风险已评估接受
    "PyQt6>=6.5.0",
    "PyQt6-Fluent-Widgets>=1.11",
    "matplotlib>=3.5",
    "pyarrow>=14",  # 客户反馈包 2026-09-23 问题4（MCP export Parquet 引擎）
]

[project.scripts]
quantstudio-daemon = "quantstudio.pipeline.daemon:main"
quantstudio-run = "quantstudio.engine.cli:main"
qs-compile = "quantstudio.strategy_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
"quantstudio.backtest.libs" = ["bse_legacy_code_mapping.json"]
"quantstudio.strategy_compiler" = ["schemas/*.json", "examples/*.json", "templates/*.j2"]
"quantstudio.strategy_compiler.release" = ["*.json", "*.md"]
